<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
  <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
  <script src="project.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: aliceblue;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #main {
      display: grid;
      grid-template-columns: 4fr 4fr 4fr;
      gap: 10px;
      width: 85%;
      height: 90vh;
      overflow-y: auto;
      background: whitesmoke;
      /* border-radius: 12px; */
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      padding: 30px;
      justify-content: space-evenly;
    }
    .cdf {
      width: 270px;
      height: 340px;
      perspective: 1000px;
      padding-left: 30px;
      margin-bottom: 20px;
      margin-left: 20px;
    }
    .inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }
    .cdf:hover .inner {
      transform: rotateY(180deg);
      height: 320px;
      width: 240px;
    }
    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .front {
      background: #fff;
      color: #333;
    }
    .front img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .front .title {
      font-weight: 600;
      font-size: 18px;
      margin-top: 8px;
      text-align: center;
      font-family: Palatino Linotype, Book Antiqua, Palatino, serif;
    }
    .front .price {
      color: green;
      font-weight: 600;
      font-size: 16px;
    }
    .back {
      background: white;
      color: black;
      font-weight: 700;
      transform: rotateY(180deg);
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
    .back .desc {
      margin-bottom: 10px;
    }
    .back .category {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 10px;
    }
    .veg,.nonveg {
      color:crimson;
    }
  </style>
</head>
<body onload="loadMenu()">
  <main id="main"></main>
  <div id="menu"></div>
</body>
</html>
